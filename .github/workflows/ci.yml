name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scaffold-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required architecture files
        run: |
          test -f src/backend/pyproject.toml
          test -f src/backend/app/main.py
          test -f docs/business-analysis/SRS.md
          test -f docker-compose.yml
      - name: Validate Docker Compose
        run: docker compose config --quiet

  backend:
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobportal
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: jobportal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://jobportal:test-only-password@localhost:5432/jobportal_test
      JWT_SECRET: ci-only-secret-with-at-least-thirty-two-characters
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: ruff check .
      - run: python -m compileall app
      - run: alembic upgrade head
      - run: pytest
