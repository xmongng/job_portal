[project]
name = "job-portal-api"
version = "0.1.0"
description = "FastAPI scaffold for the Job Portal backend"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16",
  "fastapi[standard]",
  "pydantic-settings>=2.0",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100
