# Usage: ENV_FILE=.env.production docker compose -f docker-compose.prod.yml up --build -d
# TLS must terminate at your reverse proxy; expose API on loopback only by default.
name: job-portal-prod
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ${ENV_FILE:?Set ENV_FILE to a private production env file}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./src/backend
    restart: unless-stopped
    env_file: ${ENV_FILE:?Set ENV_FILE to a private production env file}
    environment:
      FILE_STORAGE_PATH: /app-data/private/resumes
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 5000 --no-proxy-headers"
    ports:
      - "127.0.0.1:8000:5000"
    volumes:
      - resume-data:/app-data/private/resumes
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
  resume-data:
