name: job-portal

services:
  postgres:
    image: postgres:16-alpine
    env_file: ${ENV_FILE:-.env.example}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build: ./src/backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 5000"
    env_file: ${ENV_FILE:-.env.example}
    environment:
      FILE_STORAGE_PATH: /app-data/private/resumes
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - resume-data:/app-data/private/resumes
    ports:
      - "8000:5000"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    profiles: ["email"]
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
  resume-data:
